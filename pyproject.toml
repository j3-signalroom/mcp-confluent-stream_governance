[project]
name = "mcp-confluent-stream-governance"
version = "0.01.00.000"
description = "MCP Confluent Stream Governance"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Jeffrey Jonathan Jennings (J3)", email = "j3@thej3.com"},
]
maintainers = [
    {name = "Jeffrey Jonathan Jennings (J3)", email = "j3@thej3.com"},
]
dependencies = [
    "cc-clients-python-lib>=0.30.3.0",
    "dotenv>=0.9.9",
    "mcp>=1.21.0",
]

[tool.setuptools]
packages = ["src"]

# Logging configuration
[tool.logging]
version = 1
disable_existing_loggers = false

[tool.logging.formatters.default]
format = "%(asctime)s - %(levelname)s - %(funcName)s - %(message)s"
datefmt = "%Y-%m-%d %H:%M:%S"

[tool.logging.handlers.file]
class = "logging.FileHandler"
filename = "mcp-confluent-stream_governance.log"
formatter = "default"
level = "INFO"
mode = "w"

[tool.logging.handlers.console]
class = "logging.StreamHandler"
formatter = "default"
level = "DEBUG"

[tool.logging.loggers.root]
level = "INFO"
handlers = ["file", "console"]

[tool.pytest.ini_options]
pythonpath = ["src"]
log_file = "mcp-confluent-stream_governance.log"
log_file_level = "INFO"
log_file_format = "%(asctime)s - %(levelname)s - %(funcName)s - %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
log_cli = 1
log_cli_level = "INFO"
log_cli_format = "%(asctime)s - %(levelname)s - %(funcName)s - %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
